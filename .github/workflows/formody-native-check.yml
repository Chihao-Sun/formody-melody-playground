name: Formody native checks
on:
  push:
    paths: ['wechat-native/**', '.github/workflows/formody-native-check.yml']
  pull_request:
    paths: ['wechat-native/**', '.github/workflows/formody-native-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
        working-directory: wechat-native
      - run: npm run check
        working-directory: wechat-native
