<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 230" role="img" aria-labelledby="lake-guide-title lake-guide-desc"><title id="lake-guide-title">湖面音色分布</title><desc id="lake-guide-desc">从岸边望向湖面，近岸是拨弦，中景从左到右是低弦、弦乐、钟琴，远处是空灵管乐。</desc><defs><linearGradient id="guide-water" x2="0" y2="1"><stop stop-color="#c4bbd6"/><stop offset="1" stop-color="#82bfc5"/></linearGradient><clipPath id="guide-clip"><rect x="10" y="35" width="300" height="163" rx="14"/></clipPath></defs><path d="m12 35 37-18 30 13 29-18 44 23 33-16 29 12 29-18 65 22" fill="#a6b2c3" opacity=".5"/><rect x="10" y="35" width="300" height="163" rx="14" fill="url(#guide-water)"/><g clip-path="url(#guide-clip)" stroke="#f7f4e8" stroke-opacity=".65" stroke-width="1"><path d="M10 82H310M10 142H310M115 82 95 142M205 82 225 142" fill="none"/><path d="M10 142H310V198H10Z" fill="#e9e6cc" fill-opacity=".3" stroke="none"/></g><g fill="#294d61" font-size="13" text-anchor="middle" font-family="inherit"><text x="160" y="64">空灵管乐</text><text x="60" y="117">低弦</text><text x="160" y="117">弦乐</text><text x="260" y="117">钟琴</text><text x="160" y="175">拨弦</text><text x="160" y="222" font-size="11" fill="#687e86">你站在这里 · 面向湖泊</text></g></svg>
